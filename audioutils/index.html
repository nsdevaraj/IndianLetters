<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Indian Letters Audio Filename Preview</title>
    <link rel="stylesheet" href="../css/fonts.css">
    <script src="../src/letters.js"></script>
    <script src="../src/audio-manifest.js"></script>
    <style>
      body { font-family: system-ui, sans-serif; margin: 20px; }
      button, select { font: inherit; min-height: 44px; margin: 4px; }
      .output { margin-top: 20px; padding: 12px; border: 1px solid #ccc; max-height: 60vh; overflow: auto; }
      .item { margin-bottom: 8px; line-height: 1.8; }
    </style>
  </head>
  <body>
    <h1>Indian Letters Audio Filename Preview</h1>
    <p>This previews filenames from the application's shared letter data. It does not generate or upload audio.</p>
    <label for="languagePicker">Language</label>
    <select id="languagePicker"></select>
    <button id="generateButton" type="button">Generate list</button>
    <p id="summary" role="status"></p>
    <div id="output" class="output"></div>
    <script>
      const picker = document.getElementById('languagePicker');
      languageDetails.forEach((details, index) => {
        const option = document.createElement('option');
        option.value = index;
        option.textContent = lang[index];
        option.style.fontFamily = details.font;
        picker.appendChild(option);
      });
      function updateFont() {
        picker.style.fontFamily = languageDetails[Number(picker.value)].font;
      }
      picker.addEventListener('change', updateFont);
      updateFont();
      document.getElementById('generateButton').addEventListener('click', () => {
        const language = Number(picker.value);
        const output = document.getElementById('output');
        output.replaceChildren();
        output.style.fontFamily = languageDetails[language].font;
        output.lang = languageDetails[language].code;
        consonantLangs[language].forEach((_, consonant) => {
          vowelLetterLangs[language].forEach((_, vowel) => {
            const item = document.createElement('div');
            item.className = 'item';
            item.textContent = getRecordedAudioFilename(language, consonant, vowel) ||
              `${getAudioFilename(language, consonant, vowel)} (not recorded)`;
            output.appendChild(item);
          });
        });
        document.getElementById('summary').textContent = `${output.children.length} filenames generated.`;
      });
    </script>
  </body>
</html>
